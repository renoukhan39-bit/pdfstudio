[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfstudio-prototype"
version = "0.1.0"
description = "PDF Studio's first reproducible PDF merge API and web prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "python-multipart==0.0.29",
  "pypdf==7.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
