[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfstudio-prototype"
version = "0.1.0"
description = "PDF Studio's first reproducible PDF merge API and web prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn==0.48.0",
  "python-multipart==0.0.32",
  "pypdf==7.0.1",
  "cryptography==50.0.0",
  "reportlab==4.4.9",
  "Pillow==13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3", "httpx==0.28.1", "pytest-cov==7.1.0",
  "ruff==0.14.10", "build==1.3.0", "pip-audit==2.10.0",
  "PyYAML==6.0.3",
]
browser = ["playwright==1.58.0"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
pythonpath = ["."]

